<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tap to Hello</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<button type="button" aria-label="画面をタップ" onClick="{{ toggle }}" style="width: 390px; height: 844px; box-sizing: border-box; margin: 0; padding: 32px; border: none; background: #F5F4F0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif; color: #1A1A1A">
<sc-if value="{{ shown }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 44px; font-weight: 700; letter-spacing: -0.5px; color: {{accent}}">Hello world!</span>
</sc-if>
<sc-if value="{{ hidden }}" hint-placeholder-val="{{ true }}">
<span style="font-size: 15px; color: #5C5C5C">画面をタップしてください</span>
</sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1A1A1A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { shown: false };
}
renderVals() {
var shown = !!this.state.shown;
return {
accent: this.props.accent ?? '#1A1A1A',
shown: shown,
hidden: !shown,
toggle: () => this.setState({ shown: !this.state.shown })
};
}
}
</script>
</body>
</html>
