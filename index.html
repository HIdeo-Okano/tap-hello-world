<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tap to Hello</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #F5F4F0;
    font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    color: #1A1A1A;
    -webkit-tap-highlight-color: transparent;
  }
  #tap {
    width: 100%; height: 100dvh; margin: 0; padding: 32px; box-sizing: border-box;
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font: inherit; color: inherit;
  }
  .hello { font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
  .hint { font-size: 15px; color: #5C5C5C; }
</style>
</head>
<body>
<button id="tap" type="button" aria-label="画面をタップ">
  <span id="msg" class="hint">画面をタップしてください</span>
</button>
<script>
  var shown = false;
  var msg = document.getElementById('msg');
  document.getElementById('tap').addEventListener('click', function () {
    shown = !shown;
    msg.textContent = shown ? 'Hello world!' : '画面をタップしてください';
    msg.className = shown ? 'hello' : 'hint';
  });
</script>
</body>
</html>
